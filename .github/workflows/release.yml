name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.1.0)'
        required: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build binaries
        run: npm run pkg:all

      - name: Prepare Release Name
        id: prep
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Verify package.json version matches tag
        run: |
          TAG="${{ steps.prep.outputs.tag }}"
          PKG=$(node -p "require('./package.json').version")
          if [ "v$PKG" != "$TAG" ]; then
            echo "::error::Tag $TAG tidak cocok dengan package.json (v$PKG). Samakan dulu sebelum rilis."
            exit 1
          fi
          echo "Versi cocok: $TAG"

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: Release ${{ steps.prep.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            binaries/jack-linux-x64
            binaries/jack-linux-arm64
            binaries/jack-macos-x64
            binaries/jack-macos-arm64
            binaries/jack-win-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
